</g>

<!-- John -->
<g transform="translate(790,88)">
  <text class="label" x="55" y="0" text-anchor="middle">John</text>
  <path class="hair-dark" d="M20 70 q12 -35 33 -15 q18 -22 35 9 q19 31 -5 44 h-58 q-24 -16 -5 -38z"/>
  <circle class="skin3" cx="55" cy="92" r="32"/>
  <circle class="thin" cx="43" cy="90" r="9"/><circle class="thin" cx="67" cy="90" r="9"/><path class="thin" d="M52 90 h6"/>
  <rect class="shirt" x="18" y="132" width="76" height="126" rx="20"/>
  <path class="line" d="M20 150 L-6 225 M91 150 L119 225"/>
  <rect class="trousers" x="24" y="250" width="28" height="105" rx="12"/><rect class="trousers" x="62" y="250" width="28" height="105" rx="12"/>
</g>

<!-- Sara -->
<g transform="translate(930,84)">
  <text class="label" x="55" y="0" text-anchor="middle">Sara</text>
  <path class="hair-dark" d="M18 55 q37 -39 74 0 v148 q-38 25 -78 0z"/>
  <circle class="skin4" cx="55" cy="86" r="30"/>
  <path class="dress" d="M22 128 h68 l26 150 h-120z"/>
  <path class="line" d="M20 150 L-5 220 M91 150 L118 220"/>
  <rect class="black" x="31" y="274" width="21" height="82" rx="10"/><rect class="black" x="61" y="274" width="21" height="82" rx="10"/>
</g>
</svg>